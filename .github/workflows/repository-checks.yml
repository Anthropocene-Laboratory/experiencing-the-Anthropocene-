name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Check repository structure, R syntax, links, and paths
        run: Rscript --vanilla validation/check_repository.R

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {'.git', '.claude', '.venv', 'renv'}
          files = [
              path for path in Path('.').rglob('*.py')
              if not excluded.intersection(path.parts)
          ]
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Parsed {len(files)} Python files')
          PY

      - name: Smoke-test the acquisition dispatcher
        run: Rscript --vanilla download_data.R --id=hilda_v2 --force --dry-run

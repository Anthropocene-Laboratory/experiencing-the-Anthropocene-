name: Usage question
description: Ask for help installing the environment, locating data, or running a documented workflow.
title: "[Help]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Please check `docs/getting-started.md` and `docs/troubleshooting.md` first. Do not share credentials, restricted data, or personal paths.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to produce or inspect?
      description: Name the feature, map, table, or layer rather than only the script number.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps already taken
      description: Include exact commands and the guide section followed.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Current status
      description: Include the relevant catalogue line and first error or confusing message, with private details removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, R/RStudio version, and whether `renv::restore()` completed.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, confidential information, licensed data, and personal filesystem paths.
          required: true
